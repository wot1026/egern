# 规则名称: China_DNS
# 规则统计: 11
# 用途: 仅供 dns.forward 的 proxy_rule_set 使用
# 来源: blackmatrix7/ios_rule_script (与完整版同源)
# 说明: 已剔除内容本质为 IPv4/IPv6 但被上游误标注为域名类型的行

domain_suffix_set:
  - cn
  - ms
domain_keyword_set:
  - .tmall.com
  - alicdn
  - alipay
  - aliyun
  - baidu
  - beplay
  - microsoft
  - officecdn
  - taobao
