# 规则名称: AppleTV_DNS
# 规则统计: 7
# 用途: 仅供 dns.forward 的 proxy_rule_set 使用
# 来源: blackmatrix7/ios_rule_script (与完整版同源)
# 说明: 已剔除内容本质为 IPv4/IPv6 但被上游误标注为域名类型的行

domain_set:
  - hls-amt.itunes.apple.com
  - hls.itunes.apple.com
  - np-edge.itunes.apple.com
  - play-edge.itunes.apple.com
  - tv.applemusic.com
  - uts-api.itunes.apple.com
domain_suffix_set:
  - tv.apple.com
