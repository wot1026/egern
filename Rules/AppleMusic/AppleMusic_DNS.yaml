# 规则名称: AppleMusic_DNS
# 规则统计: 9
# 用途: 仅供 dns.forward 的 proxy_rule_set 使用
# 来源: blackmatrix7/ios_rule_script (与完整版同源)

domain_set:
  - aod-ssl.itunes.apple.com
  - aod.itunes.apple.com
  - audio-ssl.itunes.apple.com
  - audio.itunes.apple.com
  - mvod.itunes.apple.com
  - streamingaudio.itunes.apple.com
domain_suffix_set:
  - applemusic.com
  - blobstore.apple.com
  - music.apple.com
