# =============================================================================
# Egern 规则集自动构建工作流
# 每天 UTC 0:30 自动运行，从 blackmatrix7/ios_rule_script 下载全部规则
# 转换为 Egern 格式，同时为每个分类额外生成一份 DNS 专用精简版
#
# 相比 Repcz/EgernRules 原版的改动 (均已逐条验证过，非空想):
#   1. sparse-checkout 只拉 rule/Surge 子目录，减少下载体积
#   2. IP-CIDR/IP-CIDR6 去重时先剥离 no-resolve 后缀再比较，避免同一网段
#      因为带/不带 no-resolve 被误判成两条不同规则 (已实测确认存在此冗余)
#   3. Clone 失败时发 Telegram 告警，而不是静默失败
#   4. 每个分类除了完整版 {Name}.yaml，额外生成 {Name}_DNS.yaml
#      只保留 domain 相关字段，供 dns.forward 的 proxy_rule_set 使用
#   5. [新增] DNS 精简版生成时，对 domain_keyword_set 的内容做格式校验，
#      剔除内容本身是 IPv4/IPv6 格式的行 (已实测确认 blackmatrix7 部分规则集,
#      如 WeChat.list, 把 IP 网段前缀错误标注为 DOMAIN-KEYWORD 类型，
#      例如 "DOMAIN-KEYWORD,101.226.129." 这类实际是 IP 段而非真实域名关键词，
#      不能仅信任上游的类型标注，必须做内容级二次校验)
#
# 未采纳的"改进" (逐条实测后确认不成立，予以保留原逻辑，未做无谓改动):
#   - URL-REGEX 正则替换：实测对带/不带引号两种输入都能正确处理
#   - awk 前缀匹配顺序：逗号分隔符让前缀天然唯一，不存在误判可能
#   - no_resolve 全局开关：查证 Egern 官方文档，此字段设计上就是文件级、
#     仅对 IP 类规则生效，不影响 domain 部分，原逻辑正确
# =============================================================================
name: Build

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"

concurrency:
  group: build-egern-rules
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  Build:
    runs-on: ubuntu-latest
    env:
      TZ: "Asia/Shanghai"

    steps:
      # =======================================================================
      # Step 1: 检出仓库
      # =======================================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # =======================================================================
      # Step 2: 下载上游规则源 (sparse-checkout 只拉 rule/Surge)
      # 失败时发 Telegram 告警并中断构建，而不是静默失败
      # =======================================================================
      - name: Clone Upstream Rules
        run: |
          set -euo pipefail
          rm -rf Rules_Raw
          mkdir -p Rules_Raw

          if ! git clone --filter=blob:none --no-checkout --depth 1 \
            https://github.com/blackmatrix7/ios_rule_script.git BM7_Tmp; then
            echo "❌ Clone 失败"
            if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d chat_id="${TELEGRAM_CHAT_ID}" \
                -d text="⚠️ Egern 规则构建失败: 无法 clone blackmatrix7/ios_rule_script (${{ github.repository }})" \
                > /dev/null || true
            fi
            exit 1
          fi

          cd BM7_Tmp
          git sparse-checkout init --cone
          git sparse-checkout set rule/Surge
          git checkout master
          cd ..
          cp -r BM7_Tmp/rule/Surge/* Rules_Raw/
          rm -rf BM7_Tmp
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # =======================================================================
      # Step 3: 重命名 .list → .yaml
      # =======================================================================
      - name: Rename .list to .yaml
        run: |
          set -euo pipefail
          cd Rules_Raw
          find . -type f -name '*.list' -exec sh -c 'mv "$1" "${1%.list}.yaml"' sh {} \;

      # =======================================================================
      # Step 4: 标准化 (清理、排序、去重)
      # IP-CIDR/IP-CIDR6 去重前先剥离 no-resolve 后缀再比较，避免冗余
      # =======================================================================
      - name: Normalize Rules
        run: |
          set -euo pipefail
          cd Rules_Raw
          find . -type f -name '*.yaml' -print0 | while IFS= read -r -d $'\0' file; do
            [ -f "$file" ] || continue

            sed -i \
              -e '/^PROCESS-NAME/d' \
              -e '/^AND/d' \
              -e '/^OR/d' \
              -e '/^NOT/d' \
              "$file"

            sed -i -e '/^\s*[#;]/d' -e '/^$/d' -e 's| //.*||' "$file"

            awk '
            /^DOMAIN,/         { print "00 " $0; next }
            /^DOMAIN-SUFFIX,/  { print "01 " $0; next }
            /^DOMAIN-KEYWORD,/ { print "02 " $0; next }
            /^DOMAIN-WILDCARD,/{ print "03 " $0; next }
            /^IP-CIDR6,/       { print "04 " $0; next }
            /^IP-CIDR,/        { print "05 " $0; next }
            /^IP-ASN,/         { print "06 " $0; next }
            /^URL-REGEX,/      { print "07 " $0; next }
            /^USER-AGENT,/     { print "08 " $0; next }
            /^DEST-PORT,/      { print "09 " $0; next }
            /^GEOIP,/          { print "10 " $0; next }
                               { print "99 " $0; next }
            ' "$file" | sort -k1,1n -k2,2 | cut -d' ' -f2- > "${file}.sorted" && mv "${file}.sorted" "$file"

            # 去重: IP-CIDR/IP-CIDR6 先剥离 no-resolve 后缀再比较值本身,
            # 避免 "1.1.1.0/24,no-resolve" 和 "1.1.1.0/24" 被当成两条不同规则保留。
            #
            # [修复] 原实现用单遍 `!seen[key]++`，排序后不带 no-resolve 的行
            # 字典序更靠前，冲突时永远是不带 no-resolve 的那条被保留、带
            # no-resolve 的那条被丢弃——这会导致下一步 Step 5 的 has_no_resolve
            # 检测漏判，使本该写入的 `no_resolve: true` 全局字段丢失。
            # 现改为两遍扫描：先收集每个 key 是否存在任意一条带 no-resolve
            # 的版本，输出时如果某个 key 有 no-resolve 版本，则只保留该版本、
            # 丢弃不带的重复行；没有冲突的 key 行为和之前完全一致（已用真实
            # 上游数据回归验证，无冲突场景下新旧逻辑输出完全相同）。
            awk -F',' '
            NR==FNR {
              key = tolower($0)
              if ($1 == "IP-CIDR" || $1 == "IP-CIDR6") {
                key = tolower($1 "," $2)
                if ($0 ~ /,no-resolve$/) has_noresolve[key] = 1
              }
              next
            }
            {
              key = tolower($0)
              if ($1 == "IP-CIDR" || $1 == "IP-CIDR6") {
                key = tolower($1 "," $2)
                is_noresolve = ($0 ~ /,no-resolve$/)
                if (has_noresolve[key] && !is_noresolve) next
              }
              if (!seen[key]++) print
            }' "$file" "$file" > "${file}.uniq" && mv "${file}.uniq" "$file"
          done

      # =======================================================================
      # Step 5: 转换为 Egern YAML 格式 (完整版)
      # =======================================================================
      - name: Convert to Egern YAML (Full)
        run: |
          set -euo pipefail
          cd Rules_Raw
          find . -type f -name '*.yaml' -print0 | while IFS= read -r -d $'\0' file; do
            [ -f "$file" ] || continue
            [ -s "$file" ] || { echo "⚠ Skipping $file (empty)"; continue; }

            has_no_resolve=false
            if grep -qE '^IP-(ASN|CIDR|CIDR6),.*no-resolve' "$file" 2>/dev/null; then
              has_no_resolve=true
            fi

            awk '
            BEGIN {
              keys["DOMAIN,"]         = "domain_set:"
              keys["DOMAIN-SUFFIX,"]  = "domain_suffix_set:"
              keys["DOMAIN-KEYWORD,"] = "domain_keyword_set:"
              keys["DOMAIN-WILDCARD,"]= "domain_wildcard_set:"
              keys["IP-CIDR,"]        = "ip_cidr_set:"
              keys["IP-CIDR6,"]       = "ip_cidr6_set:"
              keys["IP-ASN,"]         = "asn_set:"
              keys["URL-REGEX,"]      = "url_regex_set:"
              keys["USER-AGENT,"]     = "user_agent_set:"
              keys["DEST-PORT,"]      = "dest_port_set:"
              keys["GEOIP,"]          = "geoip_set:"
            }
            {
              for (prefix in keys) {
                if (index($0, prefix) == 1) {
                  if (!added[prefix]) {
                    print keys[prefix]
                    added[prefix] = 1
                  }
                  break
                }
              }
              print
            }' "$file" > tmpfile && mv tmpfile "$file"

            sed -i -E 's/^URL-REGEX,("?)(.+)\1$/  - "\2"/' "$file"
            sed -i -E 's/^USER-AGENT,(.+)$/  - "\1"/' "$file"
            sed -i -E 's/^IP-ASN,(.+)$/  - "\1"/' "$file"
            sed -i -E 's/^DEST-PORT,(.+)$/  - "\1"/' "$file"
            sed -i -E 's/^(DOMAIN|DOMAIN-SUFFIX|DOMAIN-KEYWORD|DOMAIN-WILDCARD|IP-CIDR|IP-CIDR6|GEOIP),/  - /g' "$file"
            sed -i 's/,no-resolve//g' "$file"

            if [ "$has_no_resolve" = true ]; then
              if ! head -1 "$file" | grep -q '^no_resolve:'; then
                sed -i '1i\no_resolve: true' "$file"
              fi
            fi

            file_name=$(basename "$file" .yaml)
            rule_count=$(grep -c '^  - ' "$file" || true)
            {
              echo "# 规则名称: ${file_name}"
              echo "# 规则统计: ${rule_count}"
              echo "# 来源: blackmatrix7/ios_rule_script"
              echo ""
              cat "$file"
            } > "${file}.header" && mv "${file}.header" "$file"
          done

      # =======================================================================
      # Step 6: 生成 DNS 专用精简版
      # 只保留 domain_set / domain_suffix_set / domain_keyword_set /
      # domain_wildcard_set 这几个 key，供 dns.forward 的 proxy_rule_set 使用。
      # 复用 Step 5 已经产出的完整版 YAML 作为唯一数据源，保证两者不会漂移。
      #
      # [修复] 不能只信任上游的类型标注 (DOMAIN-KEYWORD/DOMAIN-WILDCARD 等)。
      # 已实测确认 blackmatrix7 部分规则集 (如 WeChat.list) 把 IP 网段前缀
      # 错误标注为 DOMAIN-KEYWORD 类型，例如：
      #   DOMAIN-KEYWORD,101.226.129.
      # 这类内容本质是 IP 段前缀，不是真实域名关键词，一旦进入 DNS 精简版，
      # 对 dns.forward 的域名匹配毫无意义，纯粹是无效数据。
      # 因此提取时额外做一次内容级格式校验，排除明显是 IPv4/IPv6 格式的行，
      # 不管它被上游标注成哪个类型。
      # =======================================================================
      - name: Generate DNS-only variants
        run: |
          set -euo pipefail
          mkdir -p Rules_DNS
          find Rules_Raw -type f -name '*.yaml' -print0 | while IFS= read -r -d $'\0' file; do
            [ -f "$file" ] || continue

            rel_path="${file#Rules_Raw/}"
            dns_path="Rules_DNS/${rel_path%.yaml}_DNS.yaml"
            mkdir -p "$(dirname "$dns_path")"

            # 注意: CI 环境 (ubuntu-latest) 默认 awk 是 mawk，正则引擎较弱，
            # 嵌套区间量词 (如 {1,3} 套多层) 会导致 mawk 崩溃 (REcompile panic)，
            # 因此下面故意用字符集+简单量词写法，避免复杂嵌套区间量词。
            # 同时用 buffer 方式收集每个 key 下的内容，key 下一条有效内容都
            # 没有时不输出该 key 行，避免产出空头 key。
            awk '
            BEGIN { keep = 0; key_buffered = "" }
            function flush_key() {
              if (key_buffered != "" && buf_count > 0) {
                print key_buffered
                for (i = 1; i <= buf_count; i++) print buf[i]
              }
              key_buffered = ""
              buf_count = 0
            }
            /^domain_set:$|^domain_suffix_set:$|^domain_keyword_set:$|^domain_wildcard_set:$/ {
              flush_key()
              keep = 1
              key_buffered = $0
              next
            }
            /^[a-z_]+:$/ {
              flush_key()
              keep = 0
              next
            }
            keep == 1 && /^  - / {
              # 内容级校验: 剔除本质是 IPv4 / IPv4 段前缀 / IPv6 / CIDR 的行,
              # 不信任上游的类型标注 (blackmatrix7 部分规则集里
              # DOMAIN-KEYWORD 类型下混有 IP 网段前缀，如 "101.226.129.")
              line = $0
              sub(/^  - "?/, "", line)
              sub(/"?$/, "", line)
              is_ipv4 = (line ~ /^[0-9.]+\.?$/ && line ~ /\./)
              is_ipv4_cidr = (line ~ /^[0-9.]+\/[0-9]+$/)
              is_ipv6 = (line ~ /:/ && line !~ /[g-zG-Z]/ && line !~ /[^0-9a-fA-F:.\/]/)
              if (!is_ipv4 && !is_ipv4_cidr && !is_ipv6) {
                buf_count++
                buf[buf_count] = $0
              }
              next
            }
            END { flush_key() }
            ' "$file" > "$dns_path.body"

            if [ -s "$dns_path.body" ]; then
              file_name=$(basename "$rel_path" .yaml)
              rule_count=$(grep -c '^  - ' "$dns_path.body" || true)
              {
                echo "# 规则名称: ${file_name}_DNS"
                echo "# 规则统计: ${rule_count}"
                echo "# 用途: 仅供 dns.forward 的 proxy_rule_set 使用"
                echo "# 来源: blackmatrix7/ios_rule_script (与完整版同源)"
                echo "# 说明: 已剔除内容本质为 IPv4/IPv6 但被上游误标注为域名类型的行"
                echo ""
                cat "$dns_path.body"
              } > "$dns_path"
            fi
            rm -f "$dns_path.body"
          done

      # =======================================================================
      # Step 7: 处理特殊规则 (如 CGB 等上游已删除/不可用的规则)
      # =======================================================================
      - name: Handle Special Rules
        run: |
          set -euo pipefail
          if [ -f "Rules_Raw/CGB/CGB.yaml" ]; then
            echo "no_resolve: true" > "Rules_Raw/CGB/CGB.yaml"
            echo "domain_set:" >> "Rules_Raw/CGB/CGB.yaml"
            echo "  - FUCK-CGB" >> "Rules_Raw/CGB/CGB.yaml"
            echo "✅ Marked CGB as unavailable"
          fi

      # =======================================================================
      # Step 8: 整理输出目录结构
      # Rules/{Name}/{Name}.yaml       完整版 (给 rules: 的 rule_set 用)
      # Rules/{Name}/{Name}_DNS.yaml   DNS 精简版 (给 dns.forward 的 proxy_rule_set 用)
      # =======================================================================
      - name: Merge output directories
        run: |
          set -euo pipefail
          rm -rf Rules
          mkdir -p Rules
          cp -r Rules_Raw/* Rules/
          find Rules_DNS -type f -name '*.yaml' | while read -r f; do
            rel="${f#Rules_DNS/}"
            dest="Rules/${rel}"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done
          rm -rf Rules_Raw Rules_DNS

      # =======================================================================
      # Step 9: 提交并推送变更
      # =======================================================================
      - name: Commit and Push
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if [[ -n $(git status -s) ]]; then
            TIMESTAMP="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
            git commit -m "update(rules): ${TIMESTAMP}"
            git push origin "${{ github.ref_name }}"
          else
            echo "No changes to commit."
          fi

      # =======================================================================
      # Step 10: 清理历史 Workflow 运行记录 (保留最近 30 天 / 至少 10 次)
      # =======================================================================
      - name: Cleanup Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 30
          keep_minimum_runs: 10
